{% extends 'base.html' %}

{% block title %}Страница не найдена — ПланМит{% endblock %}

{% block content %}
<div class="card" style="text-align:center; padding:48px 24px; max-width:480px; margin:0 auto;">
    <div style="font-size:64px; margin-bottom:16px;">🔍</div>
    <h1 style="margin-bottom:8px;">Страница не найдена</h1>
    <p class="text-muted" style="margin-bottom:24px;">
        Возможно, событие было удалено или ссылка устарела.
    </p>
    <div class="flex" style="justify-content:center; gap:12px;">
        {% if user.is_authenticated %}
            <a href="{% url 'events:my_events' %}" class="btn btn-primary">📋 Мои события</a>
        {% endif %}
        <a href="{% url 'core:home' %}" class="btn btn-ghost">На главную</a>
    </div>
</div>
{% endblock %}
