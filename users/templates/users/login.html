{% extends 'base.html' %}

{% block title %}Вход — ПланМит{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 32px auto;">
    <div class="card">
        <h2 class="text-center mb-2">🔐 Вход</h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="id_username">Имя пользователя</label>
                <input type="text" name="username" id="id_username" class="form-input" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label" for="id_password">Пароль</label>
                <input type="password" name="password" id="id_password" class="form-input" required>
            </div>
            {% if form.non_field_errors %}
                <div class="form-errors">{{ form.non_field_errors }}</div>
            {% endif %}
            <button type="submit" class="btn btn-primary btn-block btn-large">Войти</button>
        </form>
        <p class="text-center mt-2 text-muted">
            Нет аккаунта? <a href="{% url 'users:register' %}">Зарегистрироваться</a>
        </p>
    </div>
</div>
{% endblock %}
